spring:
  application:
    name: review-service

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: schema_review
    locations: classpath:db/migration

  datasource:
    url: jdbc:postgresql://localhost:5432/hotel
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: schema_review
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8085
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: true
    path: /api/reviews/openapi/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/reviews/openapi/swagger-ui.html

logging:
  level:
    org.springframework.cloud.sleuth: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
