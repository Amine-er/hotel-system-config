spring:
  application:
    name: payment-service-mock

  datasource:
    url: jdbc:h2:mem:paymentdb
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  jpa:
    show-sql: true
    properties:
      hibernate:
        ddl-auto: none
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: PUBLIC
    table: flyway_schema_history

server:
  port: 8084
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: true
    path: /api/payments/openapi/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/payments/openapi/swagger-ui.html


logging:
  level:
    org.springframework.cloud.sleuth: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
