spring:
  application:
    name: booking-service
    
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false  

  data:
    mongodb:
      host: localhost
      port: 27017
      database: bookingdb
      username: bookinguser
      password: bookingpass

server:
  port: 8083
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: true
    path: /api/bookings/openapi/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/bookings/openapi/swagger-ui.html

logging:
  level:
    org.springframework.cloud.sleuth: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

payment:
  service:
    url: http://PAYMENT-SERVICE-MOCK/api/payments/check-balance

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
